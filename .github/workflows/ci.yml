name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint:ci

      - name: Typecheck
        run: pnpm run build:typecheck

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: dash/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('dash/src/**', 'shared/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # Placeholder values based on dash/.env.local.example. The build fails without NEXT_PUBLIC_API_URL and
      # without a hostname in BACKGROUNDS_BUCKET_DOMAIN.
      - name: Build dashboard
        run: pnpm --dir dash build
        env:
          NEXT_PUBLIC_ENVIRONMENT: dev
          NEXT_PUBLIC_API_URL: https://api.lurkr.gg/v2
          NEXT_PUBLIC_URL: http://localhost:3000
          BACKGROUNDS_BUCKET_DOMAIN: backgrounds.example.com

      # Fetches the OpenAPI document from the live API first, like the deployment build, and fails if that
      # request does.
      - name: Build docs
        run: pnpm --dir docs build
